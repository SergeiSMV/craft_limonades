# Локальный dev-стек Craft WMS: postgres + backend + nginx.
# Запуск из корня проекта: `make up` (обёртка над
# `docker compose --env-file .env -f infra/docker-compose.yml up`).
#
# Стек считается «поднятым», когда все healthcheck'и зелёные: зависимости
# выстроены через condition: service_healthy, а не просто по факту старта.

services:
  # --- PostgreSQL: хранилище данных ---
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"   # публикуем на хост для локальных инструментов (psql, GUI)
    volumes:
      - db_data:/var/lib/postgresql/data   # данные переживают пересоздание контейнера
    healthcheck:
      # «Жив», когда postgres реально принимает подключения, а не просто запущен.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Backend: Go-сервис (наружу напрямую не публикуется) ---
  backend:
    build:
      context: ../apps/backend      # путь относительно расположения этого compose-файла
      dockerfile: Dockerfile
    environment:
      APP_PORT: 8080
      # Готово для P0-02 (подключение к БД). Минимальный /health-сервер это пока не использует.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy   # стартуем только после «живой» БД
    expose:
      - "8080"   # порт виден только внутри сети compose; наружу ходим через nginx
    healthcheck:
      # «Жив», когда backend отвечает на /health. wget -O /dev/null работает и в BusyBox, и в GNU.
      # Адрес 127.0.0.1 (а не localhost) — чтобы проверка не ушла в IPv6 ::1, где сервис не слушает.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- nginx: единственная точка входа в стек снаружи ---
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT}:80"   # стек доступен снаружи по http://localhost:${HTTP_PORT}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy   # проксируем только на «живой» backend
    healthcheck:
      # Проверяем сквозной путь: nginx → backend /health.
      # 127.0.0.1, а не localhost: nginx слушает `listen 80;` только по IPv4,
      # а localhost внутри контейнера может резолвиться в IPv6 ::1 → connection refused.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
