# Reverse proxy: единственная точка входа в стек снаружи.
# Весь входящий трафик уходит на backend-контейнер во внутренней сети docker-compose -
# сам backend наружу не публикуется.

upstream backend {
    # Имя `backend` резолвится в IP контейнера сервисом DNS docker-compose.
    server backend:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;

        # Пробрасываем реальные данные клиента - понадобятся бэкенду для логов и rate limiting.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
