# nginx тестового стенда - та же раскладка, что у боевого vhost (ADR-0015):
# API под /api/, пробы /health и /ready на корне, всё остальное - статика портала.

server {
    listen 80;

    # Адрес бэкенда - через DNS Docker при каждом запросе, а не раз при старте nginx: бэкенд
    # стенда пересоздаётся (новая ветка, STAND_CZ), и прежний адрес давал 502 (ADHOC-54).
    # proxy_pass с переменной без пути передаёт путь запроса как есть.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $stand_backend backend:8080;

    # Импорт справочников грузит .xls/.xlsx через портал - дефолтный 1 МБ мал.
    client_max_body_size 50m;

    # Без завершающего слэша в proxy_pass: путь /api/v1/... уходит на бэкенд как есть.
    location /api/ {
        proxy_pass http://$stand_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health { proxy_pass http://$stand_backend; }
    location = /ready  { proxy_pass http://$stand_backend; }

    # Портал - одностраничное приложение: любой неизвестный путь отдаёт index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
