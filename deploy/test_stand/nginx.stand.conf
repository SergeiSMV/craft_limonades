# nginx тестового стенда — та же раскладка, что у боевого vhost (ADR-0015):
# API под /api/, пробы /health и /ready на корне, всё остальное — статика портала.

upstream backend {
    server backend:8080;
}

server {
    listen 80;

    # Импорт справочников грузит .xls/.xlsx через портал — дефолтный 1 МБ мал.
    client_max_body_size 50m;

    # Без завершающего слэша в proxy_pass: путь /api/v1/... уходит на бэкенд как есть.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health { proxy_pass http://backend; }
    location = /ready  { proxy_pass http://backend; }

    # Портал — одностраничное приложение: любой неизвестный путь отдаёт index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
