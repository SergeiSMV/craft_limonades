name: craft_wms
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.0+3

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # русские системные виджеты: календарь, подсказки, меню выделения
    sdk: flutter

  cupertino_icons: ^1.0.8 # иконки в стиле iOS (CupertinoIcons)
  flutter_bloc: ^9.1.1 # state management (BLoC/Cubit)
  auto_route: ^11.1.0 # декларативный роутинг, type-safe навигация
  get_it: ^9.2.1 # service locator (DI-контейнер)
  injectable: ^3.0.0 # аннотации для автогенерации регистрации в get_it
  dio: ^5.10.0 # HTTP-клиент (REST API, интерсепторы)
  either_dart: ^1.0.0 # Either<Failure, T> — типобезопасные ошибки вместо throw
  freezed_annotation: ^3.1.0 # аннотации для immutable-моделей (union/copyWith)
  json_annotation: ^4.12.0 # аннотации @JsonSerializable для (де)сериализации
  talker_flutter: ^5.1.17 # структурированное логирование + UI-просмотр логов
  talker_dio_logger: ^5.1.17 # логирование HTTP-запросов/ответов dio
  talker_bloc_logger: ^5.1.17 # логирование событий и переходов состояний BLoC
  slang: ^4.18.0 # type-safe i18n: строки в Dart, без .arb
  slang_flutter: ^4.18.0 # Flutter-интеграция slang (Locale, context.t)
  flutter_secure_storage: ^10.3.1 # зашифрованное хранилище токенов (Android Keystore; на вебе — браузер)
  web: ^1.1.0 # доступ к DOM в веб-портале (нативный <input type=file> для выбора .xls)
  material_design_icons_flutter: ^7.0.7296
  flutter_svg: ^2.3.0
  flutter_neumorphic_plus: ^3.5.0
  drift: ^2.34.4 # локальная БД устройства (sqlite) — офлайн-стор и кэш справочников (P2-02)
  drift_flutter: ^0.3.1 # подключение drift к файлу БД на устройстве (нативные библиотеки sqlite3)
  path_provider: ^2.1.6 # каталог файла базы: вход в демо-режим стирает базу демо (ADHOC-67)
  uuid: ^4.5.1 # operation_id для очереди операций — ключ идемпотентности (P2-03)
  connectivity_plus: ^6.1.0 # событие смены сети — подсказка «попробовать раньше» (P2-04)
  permission_handler: ^12.0.1 # запрос прав на поиск Bluetooth-устройств (P4-05)
  image_picker: ^1.1.2
  sentry_flutter: ^9.0.0
  url_launcher: ^6.3.3 # ссылка на политику конфиденциальности с экрана входа (ADHOC-66, требование RuStore)
  flutter_rustore_update: ^10.5.5 # обновление ТСД из RuStore: тихое скачивание на экране входа (ADHOC-69)


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0 # рекомендуемый набор lint-правил для Dart/Flutter
  mocktail: ^1.0.4 # моки без кодогенерации (для unit-тестов)
  bloc_test: ^10.0.0 # хелперы для тестирования bloc/cubit (blocTest)
  build_runner: ^2.15.1 # раннер кодогенерации (freezed, json, routes, injectable)
  auto_route_generator: ^10.5.0 # генерация роутов из @RoutePage
  injectable_generator: ^3.0.2 # генерация register/get_it из @injectable
  freezed: ^3.2.5 # генерация immutable-классов, union types, copyWith
  json_serializable: ^6.14.0 # генерация fromJson/toJson
  slang_build_runner: ^4.18.0 # генерация классов переводов из JSON/YAML
  flutter_gen_runner: ^5.10.0 # генерация типобезопасных ссылок на ассеты (Assets.images.*)
  flutter_native_splash: ^2.4.4 # генерация нативного splash-экрана (до загрузки Flutter)
  drift_dev: ^2.34.0 # генерация кода таблиц и запросов drift

# FlutterGen: генерирует lib/core/gen/assets.gen.dart (Assets.images.<файл>) —
# типобезопасный доступ к ассетам вместо строковых путей. Запускается build_runner'ом.
flutter_gen:
  output: lib/core/gen/   # рядом со slang-геном (strings.g.dart)
  line_length: 100
  integrations:
    flutter_svg: true # SvgGenImage + .svg() для assets/**/*.svg (нужен flutter_svg)

# FlutterNativeSplash: нативный splash (ОС показывает его, пока грузится движок Flutter).
# Чёрный фон + логотип по центру. Генерируется командой `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#1E293B"
  image: assets/images/cl_icon.png
  # Веб-заставку генератором НЕ управляем: у портала своя лёгкая заставка,
  # свёрстанная вручную в web/index.html (slate-фон + янтарный спиннер).
  web: false
  # Android 12+ — отдельная splash-API ОС (иконка по центру на фоне color).
  android_12:
    color: "#1E293B"
    image: assets/images/cl_icon.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/menu_icons/

  # Локальный Inter (assets/fonts/Inter) — для портала и приложения без google_fonts.
  # Variable Inter-V.ttf не подключаем: Flutter берёт статичные .otf по weight/style.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Thin.otf
        - asset: assets/fonts/Inter/Inter-ThinItalic.otf
        - asset: assets/fonts/Inter/Inter-ExtraLight.otf
        - asset: assets/fonts/Inter/Inter-ExtraLightItalic.otf
        - asset: assets/fonts/Inter/Inter-Light.otf
        - asset: assets/fonts/Inter/Inter-LightItalic.otf
        - asset: assets/fonts/Inter/Inter-Regular.otf
        - asset: assets/fonts/Inter/Inter-Italic.otf
        - asset: assets/fonts/Inter/Inter-Medium.otf
        - asset: assets/fonts/Inter/Inter-MediumItalic.otf
        - asset: assets/fonts/Inter/Inter-SemiBold.otf
        - asset: assets/fonts/Inter/Inter-SemiBoldItalic.otf
        - asset: assets/fonts/Inter/Inter-Bold.otf
        - asset: assets/fonts/Inter/Inter-BoldItalic.otf
        - asset: assets/fonts/Inter/Inter-ExtraBold.otf
        - asset: assets/fonts/Inter/Inter-ExtraBoldItalic.otf
        - asset: assets/fonts/Inter/Inter-Black.otf
        - asset: assets/fonts/Inter/Inter-BlackItalic.otf
