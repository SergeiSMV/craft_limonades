<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Веб-портал WMS ТД «Крафтовые лимонады»">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="КЛ: Склад">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>КЛ: Склад - портал</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <!--
    HTML-заставка портала до старта Flutter - визуальный близнец Flutter `_LoadingView`
    (logo_alpha + green + вращающийся loading). Картинки в web/splash/ (ассеты Flutter
    ещё недоступны). Снимается при первом кадре Flutter (скрипт ниже).
  -->
  <style id="splash-screen-style">
    html, body { margin: 0; height: 100%; }
    body { background-color: #1e293b; } /* AppColors.kSidebarBg */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      transition: opacity 0.3s ease;
    }
    #splash.hide { opacity: 0; }
    /* Аналог Assets.images.logoAlpha + color: AppColors.kPrimary (#F59E0B) */
    #splash .logo {
      width: 256px;
      height: auto;
      display: block;
      /* srcIn-подобная перекраска силуэта в янтарь */
      filter: brightness(0) saturate(100%) invert(72%) sepia(68%)
              saturate(2148%) hue-rotate(360deg) brightness(101%) contrast(96%);
    }
    /* Stack 90×90: leaf + spinning ring (как в _LoadingView) */
    #splash .loader {
      position: relative;
      width: 90px;
      height: 90px;
    }
    #splash .leaf {
      position: absolute;
      left: 20px;
      top: 25px;
      width: 30px;
      height: 30px;
    }
    #splash .ring {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 64px;
      height: 64px;
      animation: splash-spin 2s linear infinite; /* Duration(seconds: 2) */
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <img class="logo" src="splash/logo_alpha.png" alt="" width="256" height="256">
    <div class="loader">
      <img class="leaf" src="splash/green.png" alt="" width="30" height="30">
      <img class="ring" src="splash/loading.png" alt="" width="64" height="64">
    </div>
  </div>

  <script>
    // Убираем заставку, как только Flutter добавил свой <flutter-view> в DOM
    // (т.е. отрисован первый кадр). Fallback по таймауту - на случай задержки.
    (function () {
      function removeSplash() {
        var el = document.getElementById('splash');
        if (!el) return;
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 300);
      }
      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          observer.disconnect();
          removeSplash();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      // Страховка: снять заставку не позже 15 с в любом случае.
      setTimeout(function () { observer.disconnect(); removeSplash(); }, 15000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async=""></script>
</body></html>
