name: CI · Backend

# Гоняется ТОЛЬКО когда менялся бэкенд (apps/backend/**) — Flutter зря не пересобираем.
# Два прогона на путь фича→dev→main (dev всегда зелёный — гейт стоит на входе в него):
# - pull_request → dev: build/vet/test/lint (гейт перед входом кода в dev);
# - push → main: то же + публикация docker-образа :main в GHCR (релиз на прод).
# push→dev и PR dev→main не гоняем — избыточно (dev уже проверен, :dev не деплоится).
on:
  pull_request:
    branches: [dev]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/ci-backend.yml'

# Отменяем устаревшие прогоны на том же ref — экономим минуты Actions.
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

# По умолчанию — только чтение; docker-джоб повышает права точечно.
permissions:
  contents: read

jobs:
  # --- Бэкенд (Go): сборка, vet, тесты, статический анализ ---
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # golangci-lint пиним на версию, проверенную локально (детерминизм: новые релизы
      # не добавят линтеры и не «покраснят» пайплайн неожиданно).
      - name: Lint (golangci-lint)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  # --- Docker-образ бэкенда → GHCR (только на push в dev/main) ---
  # Зависит только от backend: образ бэкенда от Flutter не зависит, блокировать его
  # поломкой Flutter незачем.
  docker:
    name: Docker image (backend → GHCR)
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Имя образа GHCR должно быть в нижнем регистре.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/craft-wms-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем ровно тот образ, что поднимает docker-compose (P0-01), и тегируем
      # именем ветки + SHA коммита.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
