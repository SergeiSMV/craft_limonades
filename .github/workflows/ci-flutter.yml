name: CI · Flutter

# Гоняется ТОЛЬКО когда менялось приложение (apps/craft_wms/**) — бэкенд зря не гоняем.
# - pull_request → dev/main: codegen + analyze + test + сборка APK (ТСД) + сборка web (портал) — гейт перед мержем.
# - push → dev/main: то же (APK и web-бандл — как артефакты прогона).
# Фиче-ветки отдельно не гоняем — их вершину покрывает событие pull_request.
# Android и web собираются в ОДНОМ джобе: переиспользуем checkout/setup/pub get/codegen
# (экономия минут Actions на free-тарифе) и держим один required-чек (см. заметку про path-фильтры внизу истории).
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/craft_wms/**'
      - '.github/workflows/ci-flutter.yml'
  push:
    branches: [dev, main]
    paths:
      - 'apps/craft_wms/**'
      - '.github/workflows/ci-flutter.yml'

# Отменяем устаревшие прогоны на том же ref — экономим минуты Actions.
concurrency:
  group: ci-flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Flutter (ТСД APK + веб-портал): codegen, анализ, тесты, сборка APK и web ---
  flutter:
    name: Flutter (Android + Web портал)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/craft_wms
    steps:
      - uses: actions/checkout@v4

      # JDK нужен Gradle при сборке Android-APK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Сгенерированные файлы (*.freezed/*.g/*.gr/*.config.dart) в .gitignore —
      # без codegen анализ и сборка упадут.
      - name: Codegen (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      # Тестов пока нет (test/ появится в P0-08/P2) — не валим пайплайн на пустоте.
      - name: Test
        run: |
          if [ -d test ]; then flutter test; else echo "тестов пока нет — пропуск"; fi

      - name: Build APK (debug)
        run: flutter build apk --debug

      # Готовый APK — как артефакт прогона (скачать из Actions и поставить на ТСД).
      # path — от корня репозитория (для uses-шагов working-directory не действует).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/craft_wms/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # --- Веб-портал (Flutter Web), точка входа lib/main_portal.dart ---
      # Реальный .env — в .gitignore (свой на каждой машине). В CI подставляем заглушку
      # из шаблона .env.example: так честно проходим путь --dart-define-from-file и ловим
      # ошибки чтения конфига, не завися от секретов. BASE_URL в App-коде имеет defaultValue,
      # но сборка портала обязана пройти именно с внешним .env — как в проде.
      - name: Prepare .env (CI stub for web build)
        run: cp .env.example .env

      # Гейт компиляции портала: ломающая web-сборку правка красит весь flutter-джоб.
      - name: Build web (portal)
        run: flutter build web -t lib/main_portal.dart --dart-define-from-file=.env --release

      # Готовый web-бандл портала — артефакт прогона (задел под воспроизводимый деплой, P1-09-3).
      - name: Upload portal web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-web-bundle
          path: apps/craft_wms/build/web
          if-no-files-found: error
