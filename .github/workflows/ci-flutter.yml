name: CI · Flutter

# Гоняется ТОЛЬКО когда менялось приложение (apps/craft_wms/**) — бэкенд зря не гоняем.
# Два прогона на путь фича→dev→main (dev всегда зелёный — гейт стоит на входе в него):
# - pull_request → dev: codegen + analyze + test + сборка APK (ТСД) + web (портал) — гейт перед входом в dev;
# - push → main: то же. Артефакты (APK/web) не выгружаем — CI только гейт, сборку делаем вручную.
# push→dev и PR dev→main не гоняем — избыточно (см. историю решений).
# Android и web собираются в ОДНОМ джобе: переиспользуем checkout/setup/pub get/codegen
# (экономия минут Actions на free-тарифе) и держим один required-чек.
on:
  pull_request:
    branches: [dev]
    paths:
      - 'apps/craft_wms/**'
      # Эталон формата батча операций живёт в дереве бэкенда, а половина контракта — в тестах
      # приложения. Без этой строки правка эталона не поднимала бы Flutter-гейт, и клиент
      # молча разошёлся бы с ним (P2-08).
      - 'apps/backend/internal/handler/testdata/**'
      - '.github/workflows/ci-flutter.yml'
  push:
    branches: [main]
    paths:
      - 'apps/craft_wms/**'
      - 'apps/backend/internal/handler/testdata/**'
      - 'infra/portal/**'
      - '.github/workflows/ci-flutter.yml'

# Отменяем устаревшие прогоны на том же ref — экономим минуты Actions.
concurrency:
  group: ci-flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Публикация образа портала в GHCR и удаление устаревших версий пакета.
  packages: write

jobs:
  # --- Flutter (ТСД APK + веб-портал): codegen, анализ, тесты, сборка APK и web ---
  flutter:
    name: Flutter (Android + Web портал)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/craft_wms
    steps:
      - uses: actions/checkout@v4

      # JDK нужен Gradle при сборке Android-APK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Сгенерированные файлы (*.freezed/*.g/*.gr/*.config.dart) в .gitignore —
      # без codegen анализ и сборка упадут.
      - name: Codegen (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      # Тестов пока нет (test/ появится в P0-08/P2) — не валим пайплайн на пустоте.
      - name: Test
        run: |
          if [ -d test ]; then flutter test; else echo "тестов пока нет — пропуск"; fi

      # Реальный .env — в .gitignore (свой на каждой машине). В CI подставляем заглушку
      # из шаблона: так проверяется, что .env.example остаётся разбираемым, и честно
      # проходится путь --dart-define-from-file, которым APK собирается на самом деле.
      - name: Prepare .env (CI stub)
        run: cp .env.example .env

      # Гейт компиляции ТСД-APK. Именно из .env: у ТСД нативная сборка, адрес сервера
      # зашивается в приложение и относительным быть не может — на устройстве нет origin,
      # относительно которого его разрешать.
      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define-from-file=.env

      # --- Веб-портал (Flutter Web), точка входа lib/main_portal.dart ---
      # Портал собирается с ОТНОСИТЕЛЬНЫМ BASE_URL и .env не использует: он живёт на одном
      # origin с API (ADR-0015), а dio поддерживает относительный baseUrl на Web. Благодаря
      # этому бандл не привязан к домену — собирается один раз и годится где угодно, поэтому
      # его и можно публиковать образом. Ничего другого из окружения сборки порталу не нужно:
      # WAREHOUSE_NAME читает только главный экран ТСД.
      - name: Build web (portal)
        run: flutter build web -t lib/main_portal.dart --dart-define=BASE_URL=/api/v1/ --release

      # APK артефактом не выгружаем: на free-тарифе артефакты выедали квоту хранилища
      # и роняли upload. Для APK CI остаётся гейтом, готовый файл собирается вручную.

      # --- Публикация портала (только релиз в main) ---
      # Бандл уезжает ОБРАЗОМ в GHCR, а не артефактом: артефакты упираются в квоту, а GHCR
      # с прод-сервера доступен и уже используется (Docker Hub из России отваливается по TLS).
      # Сервер забирает образ в обычном обновлении и раскладывает бандл — publish портала
      # перестаёт быть ручной операцией.
      # Имя образа GHCR должно быть в нижнем регистре, а логин владельца — нет
      # (SergeiSMV). Без приведения docker отвергает имя целиком.
      - name: Compute image name
        if: github.event_name == 'push'
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/craft-wms-portal" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push portal image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          # Контекст — каталог build: Dockerfile копирует из него подкаталог web.
          context: apps/craft_wms/build
          file: infra/portal/Dockerfile
          push: true
          # Только :main, без тега по sha: иначе каждая сборка оставляет версию навсегда,
          # а бандл весит полсотни мегабайт.
          tags: ${{ steps.img.outputs.name }}:main

      # Прошлые версии остаются в реестре без тега и копятся. Держим одну на всякий случай
      # (откат), остальные удаляем.
      - name: Prune old portal images
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: craft-wms-portal
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
