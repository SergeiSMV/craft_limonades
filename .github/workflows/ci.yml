name: CI

# Триггеры (P0-08): гейт перед мержем в интеграционные ветки + сборка образов на них.
# - pull_request → dev/main: lint + test + build (Go + Flutter); красный блокирует мерж.
# - push → dev/main: то же + публикация docker-образа бэкенда в GHCR (только из влитого кода).
# Фиче-ветки отдельно не гоняем — их вершину покрывает событие pull_request.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Отменяем устаревшие прогоны на том же ref — экономим минуты Actions.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# По умолчанию — только чтение; docker-джоб повышает права точечно.
permissions:
  contents: read

jobs:
  # --- Бэкенд (Go): сборка, vet, тесты, статический анализ ---
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # golangci-lint пиним на версию, проверенную локально (детерминизм: новые релизы
      # не добавят линтеры и не «покраснят» пайплайн неожиданно).
      - name: Lint (golangci-lint)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  # --- Flutter (Android/ТСД): codegen, анализ, тесты, сборка APK ---
  flutter:
    name: Flutter (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/craft_wms
    steps:
      - uses: actions/checkout@v4

      # JDK нужен Gradle при сборке Android-APK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Сгенерированные файлы (*.freezed/*.g/*.gr/*.config.dart) в .gitignore —
      # без codegen анализ и сборка упадут.
      - name: Codegen (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      # Тестов пока нет (test/ появится в P0-08/P2) — не валим пайплайн на пустоте.
      - name: Test
        run: |
          if [ -d test ]; then flutter test; else echo "тестов пока нет — пропуск"; fi

      - name: Build APK (debug)
        run: flutter build apk --debug

  # --- Docker-образ бэкенда → GHCR (только на push в dev/main) ---
  docker:
    name: Docker image (backend → GHCR)
    runs-on: ubuntu-latest
    needs: [backend, flutter]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Имя образа GHCR должно быть в нижнем регистре.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/craft-wms-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем ровно тот образ, что поднимает docker-compose (P0-01), и тегируем
      # именем ветки + SHA коммита.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
